# quartz/.github/workflows/deploy.yml
name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4
  repository_dispatch:
    types:
      - wiki-updated

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ① Quartz 本体のコードを checkout
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # ② wiki リポジトリを content/ に直接 clone する
      - name: Checkout wiki into content
        uses: actions/checkout@v4
        with:
          repository: Jun-robot/wiki   # ← あなたの wiki リポ
          path: content                # ← Quartz が見るフォルダ
          ref: main                    # ← wiki 側のブランチ

      # ③ ここから下は今と同じ
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
